<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>if(location.hostname==="immmahh-sketch.github.io"){location.replace("https://homebrewhero.app"+location.pathname.replace(/^\/homebrew-hero/,"")+location.search+location.hash);}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Your Password — Homebrew Hero</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍺</text></svg>">
<style>
  .reset-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .reset-card { max-width: 420px; width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 36px 28px; }
  .reset-mug { font-size: 40px; margin-bottom: 6px; text-align: center; }
  .reset-card h1 { font-size: 24px; margin: 0 0 10px; text-align: center; }
  .reset-card .lead { text-align: center; margin-bottom: 24px; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--border); border-top-color: var(--amber); margin: 0 auto 18px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a href="index.html" class="logo">
      <span class="mug">🍺</span>
      <span><span class="word-home">Homebrew</span> <span class="word-hero">Hero</span></span>
    </a>
  </div>
</header>

<div class="reset-wrap">
  <div class="reset-card" id="card">
    <div class="spinner"></div>
    <p class="lead" style="text-align:center;">Checking your reset link…</p>
  </div>
</div>

<script>
(function () {
  var SUPABASE_URL = 'https://qrihcvanmkdsaojuhasm.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_tFB-sh1Zh7lk0StvG9aGdw_v6LCEyck';
  var card = document.getElementById('card');

  // Supabase's default (implicit) recovery flow appends the session as a URL
  // fragment, not a query string — #access_token=...&type=recovery&...
  var hashParams = new URLSearchParams(location.hash.replace(/^#/, ''));
  var accessToken = hashParams.get('access_token');
  var type = hashParams.get('type');

  function renderInvalid() {
    card.innerHTML =
      '<div class="reset-mug">🍺</div>' +
      '<h1>This link has expired</h1>' +
      '<p class="lead">Password reset links only work once and expire after a while. Go back to the app and tap "Forgot password?" again for a fresh one.</p>';
  }

  function renderForm() {
    card.innerHTML =
      '<div class="reset-mug">🍺</div>' +
      '<h1>Choose a new password</h1>' +
      '<p class="lead">Pick something you\'ll remember, then head back to the app and sign in with it.</p>' +
      '<form id="reset-form" class="tester-form">' +
      '<div class="field">' +
      '<label for="password">New password</label>' +
      '<input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>' +
      '</div>' +
      '<div class="field">' +
      '<label for="password2">Confirm new password</label>' +
      '<input type="password" id="password2" name="password2" autocomplete="new-password" minlength="6" required>' +
      '</div>' +
      '<button type="submit" class="btn btn-amber submit-btn" id="submit-btn">Set New Password</button>' +
      '<p id="form-status" class="form-status" role="status" hidden></p>' +
      '</form>';

    var form = document.getElementById('reset-form');
    var statusEl = document.getElementById('form-status');
    var submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var password = document.getElementById('password').value;
      var password2 = document.getElementById('password2').value;
      statusEl.hidden = true;

      if (password.length < 6) {
        statusEl.textContent = 'Password must be at least 6 characters.';
        statusEl.className = 'form-status error';
        statusEl.hidden = false;
        return;
      }
      if (password !== password2) {
        statusEl.textContent = "Passwords don't match — try again.";
        statusEl.className = 'form-status error';
        statusEl.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Saving…';

      fetch(SUPABASE_URL + '/auth/v1/user', {
        method: 'PUT',
        headers: {
          'content-type': 'application/json',
          apikey: SUPABASE_ANON_KEY,
          authorization: 'Bearer ' + accessToken,
        },
        body: JSON.stringify({ password: password }),
      })
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .then(function (result) {
          if (!result.ok) throw new Error((result.data && result.data.msg) || 'Could not update password.');
          card.innerHTML =
            '<div class="reset-mug">🍺</div>' +
            '<h1>Password updated</h1>' +
            '<p class="lead">Head back to the Homebrew Hero app and sign in with your new password.</p>';
        })
        .catch(function (err) {
          statusEl.textContent = err.message || 'Something went wrong — try requesting a fresh link from the app.';
          statusEl.className = 'form-status error';
          statusEl.hidden = false;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Set New Password';
        });
    });
  }

  if (!accessToken || type !== 'recovery') {
    renderInvalid();
  } else {
    renderForm();
  }
})();
</script>

<script>(function(){var u="https://qrihcvanmkdsaojuhasm.supabase.co/functions/v1/track-visit";var d=JSON.stringify({path:location.pathname,referrer:document.referrer||null});if(navigator.sendBeacon){navigator.sendBeacon(u,new Blob([d],{type:"application/json"}));}else{fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:d,keepalive:true}).catch(function(){});}})();</script>
</body>
</html>
